name: Intelia integration

# Intelia fork (README-INTELIA.md): upstream's API integration tests, too slow for
# every PR on GitHub runners. intelia-release.yml calls it before publishing; also
# runs on demand and on PRs that change the integration tests or how they run.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/intelia-integration.yml
      - scripts/ci/intelia-test-integration.sh
      - tests/api-integration/**
      - apps/api/vitest.integration.config.ts

concurrency:
  group: intelia-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Throwaway PostgreSQL with its own mark (design 21 §4.9), as locally.
      - run: scripts/ci/intelia-test-integration.sh
