name: Intelia candidate image

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions: {}

concurrency:
  group: intelia-candidate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Build candidate image
    if: startsWith(github.head_ref, 'intelia/upstream-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute candidate tag
        id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sha12="${HEAD_SHA:0:12}"
          echo "tag=candidate-${sha12}" >> "$GITHUB_OUTPUT"
      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kaneo:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=MIT
      - name: Summarise the candidate image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kaneo:${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published candidate image $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
