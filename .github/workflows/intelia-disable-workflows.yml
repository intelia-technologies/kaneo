name: Intelia disable upstream workflows

on:
  push:
    branches: [main]

permissions: {}
concurrency:
  group: intelia-upstream-sync
  cancel-in-progress: false


jobs:
  disable-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Disable workflows and cancel pending runs outside the allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/intelia-upstream-sync.mjs disable-workflows
