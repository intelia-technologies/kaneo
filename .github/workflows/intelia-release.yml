name: Intelia release

# Intelia fork (README-INTELIA.md): a vX.Y.Z-intelia.N tag on reviewed main
# publishes the bundled image as ghcr.io/<owner>/kaneo:X.Y.Z-intelia.N once the
# fork's CI and the integration tests pass on that commit.
on:
  push:
    tags:
      - "v*-intelia.*"

permissions: {}

concurrency:
  group: intelia-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check the tag against package.json and main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-intelia\.[1-9][0-9]*$ ]]; then
            echo "Expected a vX.Y.Z-intelia.N tag, got $TAG" >&2
            exit 1
          fi
          upstream="${BASH_REMATCH[1]}"
          package="$(node -p 'require("./package.json").version')"
          if [[ "$upstream" != "$package" ]]; then
            echo "$TAG does not carry the upstream version in package.json ($package)" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/intelia-ci.yml # zizmor: ignore[self-repository] $/-syntax not parsed by pinned actionlint v1.7.12; revisit when supported

  integration:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/intelia-integration.yml # zizmor: ignore[self-repository] $/-syntax not parsed by pinned actionlint v1.7.12; revisit when supported

  image:
    name: Image
    needs: [verify, ci, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64,linux/arm64
          push: true
          # Repo público: por defecto sería mode=max, que publica el payload del evento de GitHub.
          provenance: mode=min
          tags: ghcr.io/${{ github.repository_owner }}/kaneo:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Summarise the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kaneo:${{ needs.verify.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
