name: Intelia release

# Intelia fork (README-INTELIA.md, «Versión»; design 58 in software-factory): every
# 15 minutes, if main's tip has no final `intelia-release` commit status yet, run the
# fork's CI and the integration tests on it. Green publishes
# ghcr.io/<owner>/kaneo:X.Y.Z-intelia.N, tags the commit vX.Y.Z-intelia.N and marks it
# success; red publishes nothing and marks it failure, so it is not retried until a
# new commit lands. Always on GitHub-hosted runners: the fork is public.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar imagen, tag y estado si pasa (no: solo prueba la punta de main)"
        type: boolean
        default: true

permissions: {}

# Queued, never cancelled: a release takes ~25 min and a queued run finds the
# commit already marked by the previous one.
concurrency:
  group: intelia-release
  cancel-in-progress: false

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      run: ${{ steps.decide.outputs.run }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Only from main's workflow
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "Run the release from main, not $REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Take main's tip
        id: tip
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Skip a commit that already has its release status
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tip.outputs.sha }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publicar }}
        run: |
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          node scripts/ci/intelia-release.mjs decide "$SHA" "$PUBLISH"

  ci:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/intelia-ci.yml # zizmor: ignore[self-repository] $/-syntax not parsed by pinned actionlint v1.7.12; revisit when supported
    with:
      sha: ${{ needs.decide.outputs.sha }}

  integration:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/intelia-integration.yml # zizmor: ignore[self-repository] $/-syntax not parsed by pinned actionlint v1.7.12; revisit when supported
    with:
      sha: ${{ needs.decide.outputs.sha }}

  publish:
    name: Publish
    needs: [decide, ci, integration]
    if: needs.decide.outputs.run == 'true' && needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Next vX.Y.Z-intelia.N for package.json's version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: node scripts/ci/intelia-release.mjs tag "$SHA"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT=${{ needs.decide.outputs.sha }}
            KANEO_IMAGE_VERSION=${{ steps.tag.outputs.version }}
          # Repo público: por defecto sería mode=max, que publica el payload del evento de GitHub.
          provenance: mode=min
          tags: ghcr.io/${{ github.repository_owner }}/kaneo:${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.decide.outputs.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=MIT
      # With GITHUB_TOKEN, so the tag triggers nothing: publishing already happened here.
      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.decide.outputs.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/ci/intelia-release.mjs push-tag "$SHA" "$TAG"
      - name: Summarise the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kaneo:${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ needs.decide.outputs.sha }}
        run: |
          echo "Published $IMAGE@$DIGEST from $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  report:
    name: Report
    needs: [decide, ci, integration, publish]
    # Not on cancellation: the commit stays pending and the next run retries it.
    if: ${{ !cancelled() && needs.decide.outputs.run == 'true' && needs.decide.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Mark the commit with intelia-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.decide.outputs.sha }}
          TAG: ${{ needs.publish.outputs.tag }}
          CI_RESULT: ${{ needs.ci.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: node scripts/ci/intelia-release.mjs report "$SHA" "$TAG" "$CI_RESULT" "$INTEGRATION_RESULT" "$PUBLISH_RESULT"
