name: Intelia secret scan

# Intelia fork (README-INTELIA.md): weekly full-history scan of main. It fails,
# with a summary, only on findings missing from scripts/ci/intelia-secret-baseline.tsv.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: intelia-secret-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  history:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - run: bash scripts/ci/intelia-secret-scan.sh "$(git rev-parse HEAD)"
