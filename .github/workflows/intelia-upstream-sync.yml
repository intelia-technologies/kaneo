name: Intelia upstream sync

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to sync (default: latest release tag; or e.g. main for rehearsal)"
        required: false
        type: string

permissions: {}

concurrency:
  group: intelia-upstream-sync
  cancel-in-progress: false

jobs:
  disable-workflows:
    name: Disable upstream workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Disable active workflows the fork does not run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/intelia-upstream-sync.mjs disable-workflows

  sync:
    name: Sync upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    environment: upstream-sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Prepare upstream sync branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: node scripts/ci/intelia-upstream-sync.mjs prepare
      - name: Generate GitHub App token
        if: steps.prepare.outputs.status == 'ready'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KANEO_SYNC_APP_ID }}
          private-key: ${{ secrets.KANEO_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Publish upstream sync PR
        if: steps.prepare.outputs.status == 'ready'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/ci/intelia-upstream-sync.mjs publish
